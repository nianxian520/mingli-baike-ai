# 命理百科 AI · 本地开发数据库
# 启动: docker compose up -d
# 停止: docker compose down
# 重置: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: mingli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mingli
      POSTGRES_PASSWORD: mingli
      POSTGRES_DB: mingli
    ports:
      - '5432:5432'
    volumes:
      - mingli_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mingli']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mingli_pg_data:
